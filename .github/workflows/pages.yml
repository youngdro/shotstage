name: Web app
# Builds the browser editor (scripts/build-web.sh) on every pull request, and publishes it to
# GitHub Pages on every push to main: https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install wasm-bindgen-cli (same version as Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          bin="$HOME/.local/bin"
          mkdir -p "$bin" && echo "$bin" >> "$GITHUB_PATH"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          # The prebuilt release is quick; GitHub's release downloads sometimes answer 504, so
          # retry, then fall back to building it from crates.io.
          if curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/wb.tar.gz \
               "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" \
             && tar -xzf /tmp/wb.tar.gz --strip-components=1 -C "$bin" "${name}/wasm-bindgen"; then
            echo "prebuilt wasm-bindgen ${version}"
          else
            cargo install wasm-bindgen-cli --version "${version}" --locked --root "$HOME/.local"
          fi
          "$bin/wasm-bindgen" --version
      - run: ./scripts/build-web.sh
        env:
          # the relay behind the "Connect Claude" button (relay/); unset = no button
          SHOTSTAGE_RELAY: ${{ vars.SHOTSTAGE_RELAY }}
      - name: No Jekyll processing
        run: |
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
