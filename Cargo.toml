[workspace]
resolver = "2"
members = ["crates/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youngdro/shotstage"
rust-version = "1.88"

[workspace.dependencies]
shotstage-core = { path = "crates/core" }
shotstage-commands = { path = "crates/commands" }
shotstage-render = { path = "crates/render" }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
log = "0.4"

[profile.release]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
