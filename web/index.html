<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shotstage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 6px 12px; border-bottom: 1px solid #333; }
    /* The editor fills whatever container you mount it in. */
    #stage { position: relative; min-height: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header>shotstage demo host page · the editor below is mounted into <code>#stage</code>; try <code>shotstage.dispatch(...)</code> in the console</header>
    <div id="stage"></div>
  </div>
  <script type="module">
    import init, { mount } from "./pkg/shotstage_app.js";
    await init();
    const editor = await mount("#stage", {});
    window.shotstage = editor;   // optional global for agents and the devtools console

    // A small starter scene, built through the same API agents use.
    editor.batch([
      { command: "entity.create", params: { type: "mesh", id: "floor", primitive: { shape: "plane", size: [12, 12] }, color: [0.5, 0.5, 0.52] } },
      { command: "entity.create", params: { type: "mesh", id: "actor", name: "Actor", primitive: { shape: "cube", size: [0.5, 1.7, 0.3] }, position: [0, 0.85, 0], color: [0.85, 0.6, 0.45] } },
      { command: "entity.create", params: { type: "mesh", id: "table", primitive: { shape: "cylinder", radius: 0.6, height: 0.75, segments: 32 }, position: [1.4, 0.375, -0.6] } },
      { command: "entity.create", params: { type: "mesh", id: "lamp", primitive: { shape: "sphere", radius: 0.25, segments: 24, rings: 12 }, position: [1.4, 0.95, -0.6], color: [0.95, 0.9, 0.6] } },
      { command: "entity.create", params: { type: "camera", id: "cam_a", name: "Cam A", position: [0.5, 1.5, 5.5] } },
      { command: "camera.lookAt", params: { id: "cam_a", target: "actor" } },
      { command: "camera.dollyMove", params: { id: "cam_a", distance: 1.5, start: 0, end: 72 } },
      { command: "camera.orbitMove", params: { id: "cam_a", target: "actor", degrees: 45, start: 72, end: 119 } },
      { command: "shot.create", params: { camera: "cam_a", start: 0, end: 119, name: "push-in" } },
    ]);
    editor.on(ev => { if (ev.type === "change") console.debug("shotstage change", ev.revision); });
  </script>
</body>
</html>
