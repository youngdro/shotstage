<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <title>shotstage · 在线 3D 导播台</title>
  <meta name="description" content="Block out scenes, people, cameras and moves in the browser; share a scene as a link.">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
    /* Phones and tablets: the editor takes every finger gesture (no page zoom, scroll bounce or
       text selection), and fills the screen between the browser bars. */
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { height: 100dvh; }
    #stage canvas { touch-action: none; }
    #bridge { position: fixed; right: 12px; bottom: 8px; color: #888; background: #111d; padding: 1px 8px; border-radius: 9px; pointer-events: none; z-index: 5; }
    #bridge:empty { display: none; }
    #bridge.connected { color: #6c6; }
    /* The editor fills whatever container you mount it in. */
    #stage { position: relative; height: 100%; }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #999; line-height: 1.7; padding: 16px; }
    #overlay.error { color: #e88; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; box-shadow: 0 6px 24px #0008; display: none; z-index: 10; }
    #toast.show { display: flex; gap: 12px; align-items: center; }
    #toast button { font: inherit; color: #9cf; background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
    /* "Connect Claude" panel */
    #agent { position: fixed; top: 44px; right: 12px; width: min(420px, calc(100% - 24px)); background: #1c1c1c; color: #ddd; border: 1px solid #444; border-radius: 8px; box-shadow: 0 8px 32px #000a; padding: 14px 16px; z-index: 11; line-height: 1.55; display: none; }
    #agent.show { display: block; }
    #agent h2 { font-size: 14px; margin: 0 0 6px; }
    #agent p, #agent ol { margin: 6px 0; }
    #agent ol { padding-left: 18px; }
    #agent .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
    #agent input { flex: 1; min-width: 0; font: 12px ui-monospace, monospace; color: #eee; background: #111; border: 1px solid #555; border-radius: 4px; padding: 5px 6px; }
    #agent button { font: inherit; color: #eee; background: #333; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
    #agent button.primary { background: #2d5a8a; border-color: #3b74b0; }
    #agent button.link { background: none; border: 0; color: #9cf; padding: 0; }
    #agent code { font: 12px ui-monospace, monospace; background: #111; padding: 1px 4px; border-radius: 3px; word-break: break-all; }
    #agent .muted { color: #999; font-size: 12px; }
    #agent .status.connected { color: #6c6; }
    #agent .close { position: absolute; top: 8px; right: 10px; }
  </style>
</head>
<body>
  <div id="stage"><div id="overlay" data-zh="正在加载编辑器…" data-en="Loading the editor…"></div></div>
  <span id="bridge"></span>
  <div id="agent" role="dialog" aria-labelledby="agent-title">
    <button class="link close" id="agent-close" aria-label="Close">✕</button>
    <h2 id="agent-title" data-zh="让 Claude 操控这个页面" data-en="Let Claude drive this editor"></h2>
    <p class="muted" data-zh="把下面的地址加到 Claude 里，Claude 就能直接在这个页面里搭场景、摆机位、截图检查，你能看着它一步步完成，每一步都能撤销。不用安装任何东西。" data-en="Add the address below to Claude and it can build the scene, place cameras and check snapshots right in this page while you watch. Every step can be undone. Nothing to install."></p>
    <div class="row"><span class="status" id="agent-status"></span><span style="flex:1"></span><button id="agent-toggle"></button></div>
    <div class="row"><input id="agent-url" readonly aria-label="MCP address"><button id="agent-copy" data-zh="复制" data-en="Copy"></button></div>
    <ol>
      <li data-zh="claude.ai 或 Claude 桌面版：设置 → 连接器（Connectors）→ 添加自定义连接器，粘贴这个地址。之后在对话里打开它即可。" data-en="claude.ai or the Claude desktop app: Settings → Connectors → Add custom connector, and paste this address. Then turn it on in a chat."></li>
      <li><span data-zh="Claude Code：" data-en="Claude Code: "></span><code id="agent-cli"></code></li>
    </ol>
    <p class="muted"><span data-zh="有这个地址的人都能改你打开的场景，不要公开发出去。" data-en="Anyone with this address can change the scene you have open, so keep it private."></span> <button class="link" id="agent-new" data-zh="换一个新地址" data-en="Make a new address"></button></p>
  </div>
  <div id="toast"><span id="toast-text"></span><button id="toast-action" hidden></button></div>
  <script type="module">
    import init, { mount } from "./pkg/shotstage_app.js";
    import { connectBridge, findBridge } from "./bridge.js";
    import { sceneToLink, sceneFromLocation, clearSceneFromLocation } from "./share.js";
    import { connectRelay, linkCode, mcpUrl } from "./agent.js";

    // ---- Interface language: follow the editor's own choice (it remembers it in localStorage). ----
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
      remove(k) { try { localStorage.removeItem(k); } catch {} },
    };
    const zh = () => { const l = store.get("shotstage.lang"); return l ? l === "zh" : navigator.language.toLowerCase().startsWith("zh"); };
    const t = (zhText, enText) => (zh() ? zhText : enText);
    const relabel = () => {
      document.documentElement.lang = zh() ? "zh-CN" : "en";
      for (const el of document.querySelectorAll("[data-zh]")) el.textContent = t(el.dataset.zh, el.dataset.en);
    };
    relabel();

    let toastTimer = 0;
    function toast(text, action, onAction, ms = 5000) {
      const box = document.getElementById("toast"), btn = document.getElementById("toast-action");
      document.getElementById("toast-text").textContent = text;
      btn.hidden = !action;
      btn.textContent = action ?? "";
      btn.onclick = () => { box.classList.remove("show"); onAction?.(); };
      box.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.remove("show"), ms);
    }

    // ---- Where Claude connects: the relay (relay/) set at build time, or ?relay=https://... ----
    let relay = new URLSearchParams(location.search).get("relay");
    if (!relay) {
      try { relay = (await (await fetch("config.json", { cache: "no-store" })).json()).relay || null; } catch { relay = null; }
    }

    // ---- Start the editor. ----
    const overlay = document.getElementById("overlay");
    let editor;
    try {
      await init();
      const toolbar = [{
        id: "share", label: "🔗 Share link", labelZh: "🔗 分享链接",
        tooltip: "Copy a link that opens a copy of this scene", tooltipZh: "复制一个链接，打开就是这个场景的副本",
      }];
      if (relay) toolbar.push({
        id: "agent", label: "🤖 Claude", labelZh: "🤖 连接 Claude",
        tooltip: "Let Claude build and edit this scene for you (no install)", tooltipZh: "让 Claude 直接在这个页面里搭场景（无需安装）",
      });
      // this page restores the autosave itself (below), so the editor need not offer it
      editor = await mount("#stage", { toolbar, restorePrompt: false });
      overlay.remove();
    } catch (e) {
      console.error(e);
      overlay.classList.add("error");
      overlay.textContent = t(
        `编辑器没能启动：${e?.message ?? e}。需要支持 WebGPU 或 WebGL2 的浏览器（新版 Chrome、Edge、Safari、Firefox）。`,
        `The editor could not start: ${e?.message ?? e}. It needs a browser with WebGPU or WebGL2 (a recent Chrome, Edge, Safari or Firefox).`);
      throw e;
    }
    window.shotstage = editor;   // optional global for agents and the devtools console

    // A small starter scene, built through the same API agents use: real-size blocks that
    // rest on each other, and a camera framed by shot size instead of coordinates.
    const EMPTY = editor.scene();
    function loadExample() {
      editor.batch([   // one step: undo returns to the scene you had
        { command: "scene.load", params: { scene: EMPTY } },
        // A fresh-food aisle, built through the same API agents use.
        { command: "entity.create", params: { type: "mesh", id: "floor", primitive: { shape: "plane", size: [14, 14] }, color: [0.62, 0.62, 0.6], locked: true } },
        { command: "prefab.create", params: { kind: "produceStand", id: "produce", position: [0, 0, -0.6] } },
        { command: "prefab.create", params: { kind: "watermelonBin", id: "melons", position: [-2.0, 0, -0.4] } },
        { command: "prefab.create", params: { kind: "openChiller", id: "chiller", position: [0.2, 0, -3.2] } },
        { command: "prefab.create", params: { kind: "openChiller", id: "chiller_2", position: [1.5, 0, -3.2] } },
        { command: "prefab.create", params: { kind: "gondolaShelf", id: "shelf", position: [-1.6, 0, -3.2] } },
        { command: "prefab.create", params: { kind: "priceSign", id: "sign", position: [1.5, 0, -1.5] } },
        { command: "prefab.create", params: { kind: "woman", id: "shopper", name: "Shopper", position: [0.3, 0, 1.0], rotationY: 180 } },
        { command: "pose.set", params: { id: "shopper", pose: "reach", joints: { shoulder_r: [-70, 0, -6], elbow_r: [-20, 0, 0] } } },
        { command: "prefab.create", params: { kind: "basket", id: "basket", position: [0.65, 0, 1.0] } },
        { command: "prefab.create", params: { kind: "man", id: "clerk", name: "Clerk", position: [-2.0, 0, 0.6], rotationY: 200 } },
        { command: "pose.set", params: { id: "clerk", pose: "crouch" } },
        { command: "prefab.create", params: { kind: "cart", id: "cart", position: [2.2, 0, 1.2], rotationY: 200 } },
        { command: "entity.create", params: { type: "camera", id: "cam_a", name: "Cam A" } },
        { command: "camera.frame", params: { camera: "cam_a", subject: "shopper", size: "full", side: "frontRight", focalLengthMm: 35 } },
        { command: "camera.dollyMove", params: { id: "cam_a", distance: 1.0, start: 0, end: 72 } },
        { command: "camera.orbitMove", params: { id: "cam_a", target: "shopper", degrees: 30, start: 72, end: 119 } },
        { command: "shot.create", params: { camera: "cam_a", start: 0, end: 119, name: "push-in" } },
      ]);
    }

    // ---- Autosave: the editor keeps the scene in this browser (IndexedDB) a moment after each
    // change and when the tab is hidden, so it survives a reload or a closed tab. ----
    let previous = null;   // your own scene, while a shared link's scene is open in its place

    /** Open the scene carried by the URL, if any; true when one was opened. */
    async function openSharedLink() {
      let shared;
      try {
        shared = await sceneFromLocation();
      } catch (e) {
        console.error(e);
        clearSceneFromLocation();
        toast(t("分享链接不完整，打不开（可能被聊天软件截断了）。", "This share link is damaged and can't be opened (a chat app may have cut it short)."), null, null, 8000);
        return false;
      }
      if (!shared) return false;
      const mine = editor.revision() > 0 ? editor.scene() : await editor.autosaved();
      try {
        editor.load(shared);
      } catch (e) {
        console.error(e);
        clearSceneFromLocation();
        toast(t(`分享的场景打不开：${e?.message ?? e}`, `Couldn't open the shared scene: ${e?.message ?? e}`), null, null, 8000);
        return false;
      }
      clearSceneFromLocation();
      if (mine) {
        // Opening someone's link must not cost you your own work: keep it one step back
        // (Undo also brings it back).
        previous = mine;
        toast(t("已打开分享的场景。", "Opened the shared scene."), t("换回我之前的场景", "Back to my previous scene"), () => {
          if (previous) editor.load(previous);
        }, 10000);
      }
      return true;
    }

    // ---- Which scene to open: agent bridge > shared link > autosave > example. ----
    // Only a page served from this machine (`shotstage mcp --live --web`) can have a bridge.
    const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    const bridgeUrl = new URLSearchParams(location.search).get("bridge") ?? (local ? await findBridge() : null);
    if (bridgeUrl) {
      // Opened by `shotstage mcp --live --web dist` (or with ?bridge=ws://...): an agent drives
      // this editor, so start empty and let it bring its scene.
      const badge = document.getElementById("bridge");
      window.shotstageBridge = connectBridge(editor, bridgeUrl, {
        onStatus: (s) => {
          badge.textContent = s === "connected" ? t("● 已连接 agent", "● agent connected") : s === "connecting" ? t("○ 正在连接 agent…", "○ connecting to agent…") : t("○ agent 已断开", "○ agent disconnected");
          badge.className = s;
        },
      });
    } else {
      const opened = await openSharedLink();
      if (!opened) {
        let restored = false;
        const saved = await editor.autosaved();
        if (saved) {
          try { editor.load(saved); restored = true; } catch (e) { console.warn("autosave unreadable", e); }
        }
        if (!restored) loadExample();
      }
      // A share link pasted into this tab's address bar only changes the fragment.
      addEventListener("hashchange", () => { openSharedLink(); });
    }

    // ---- Share. ----
    async function share() {
      const pending = sceneToLink(editor.scene());
      let copied = false;
      try {
        // Safari only allows the copy inside the click, so hand it the link still being made.
        const item = new ClipboardItem({ "text/plain": pending.then(u => new Blob([u], { type: "text/plain" })) });
        await navigator.clipboard.write([item]);
        copied = true;
      } catch {
        try { await navigator.clipboard.writeText(await pending); copied = true; } catch {}
      }
      const url = await pending;
      const kb = Math.round(url.length / 1024);
      const long = url.length > 60000
        ? t(`链接较长（${kb} KB，模型、贴图或 HDRI 都打包在里面），有些聊天软件会截断；可改发 文件 → 保存 的 .json。`, `The link is long (${kb} KB: models, textures and HDRIs travel inside it); some chat apps cut long links, so you may want to send File → Save's .json instead.`)
        : "";
      if (copied) {
        toast(t("分享链接已复制。打开它的人看到的是现在这个场景的一份副本。", "Share link copied. Whoever opens it gets a copy of this scene as it is now.") + (long ? " " + long : ""), null, null, long ? 12000 : 5000);
      } else {
        window.prompt(t("复制这个链接：", "Copy this link:"), url);
      }
    }
    editor.on(ev => { if (ev.type === "toolbar" && ev.id === "share") share(); });

    // ---- Connect Claude through the relay: Claude's tool calls run in this editor. ----
    if (relay && !bridgeUrl) {
      const ON = "shotstage.agent.on";
      const $ = (id) => document.getElementById(id);
      const panel = $("agent"), badge = $("bridge");
      let link = null, code = linkCode(store), state = "off", activity = "";
      const render = () => {
        const url = mcpUrl(relay, code);
        $("agent-url").value = url;
        $("agent-cli").textContent = `claude mcp add --transport http shotstage ${url}`;
        const label = {
          off: t("未连接", "Not connected"),
          connecting: t("○ 正在连接…", "○ Connecting…"),
          connected: t("● 已连接，等待 Claude 的指令", "● Connected: waiting for Claude"),
          disconnected: t("○ 连接断开，正在重连…", "○ Connection lost, reconnecting…"),
          replaced: t("已在另一个标签页打开，这里已停止", "Opened in another tab, stopped here"),
        }[state];
        $("agent-status").textContent = label;
        $("agent-status").className = "status " + state;
        $("agent-toggle").textContent = link ? t("断开", "Disconnect") : t("连接", "Connect");
        $("agent-toggle").className = link ? "" : "primary";
        badge.textContent = state === "off" ? "" : state === "connected" ? (activity || t("● Claude 已连接", "● Claude connected")) : label;
        badge.className = state;
      };
      let activityTimer = 0;
      const start = () => {
        link?.close();
        link = connectRelay(editor, relay, code, {
          onStatus: (s) => {
            state = s;
            if (s === "replaced") { link = null; store.remove(ON); }
            render();
          },
          onCall: (name, args) => {
            const what = name === "command_run" ? args?.command : name === "command_batch" ? t(`${args?.steps?.length ?? 0} 步操作`, `${args?.steps?.length ?? 0} steps`) : name;
            activity = t(`● Claude：${what}`, `● Claude: ${what}`);
            clearTimeout(activityTimer);
            activityTimer = setTimeout(() => { activity = ""; render(); }, 2500);
            render();
          },
        });
        store.set(ON, "1");
      };
      const stop = () => { link?.close(); link = null; state = "off"; store.remove(ON); render(); };
      $("agent-toggle").onclick = () => (link ? stop() : start());
      $("agent-close").onclick = () => panel.classList.remove("show");
      $("agent-copy").onclick = async () => {
        try { await navigator.clipboard.writeText($("agent-url").value); toast(t("地址已复制。", "Address copied.")); }
        catch { $("agent-url").select(); }
      };
      $("agent-new").onclick = () => {
        if (!confirm(t("换成新地址后，旧地址立刻失效，需要在 Claude 里重新添加。继续吗？", "The old address stops working at once and has to be replaced in Claude. Continue?"))) return;
        code = linkCode(store, true);
        if (link) start();
        render();
      };
      editor.on(ev => {
        if (ev.type !== "toolbar" || ev.id !== "agent") return;
        relabel();
        render();
        panel.classList.toggle("show");
        if (panel.classList.contains("show") && !link) start(); // opening the panel means "connect me"
      });
      if (store.get(ON)) start();
      render();
    }
    editor.on(ev => { if (ev.type === "change") console.debug("shotstage change", ev.revision); });
  </script>
</body>
</html>
