<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shotstage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 6px 12px; border-bottom: 1px solid #333; }
    /* The editor fills whatever container you mount it in. */
    #stage { position: relative; min-height: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header>shotstage demo host page · the editor below is mounted into <code>#stage</code>; try <code>shotstage.dispatch(...)</code> or <code>await shotstage.snapshot()</code> in the console</header>
    <div id="stage"></div>
  </div>
  <script type="module">
    import init, { mount } from "./pkg/shotstage_app.js";
    await init();
    const editor = await mount("#stage", {});
    window.shotstage = editor;   // optional global for agents and the devtools console

    // A small starter scene, built through the same API agents use: real-size blocks that
    // rest on each other, and a camera framed by shot size instead of coordinates.
    editor.batch([
      { command: "entity.create", params: { type: "mesh", id: "floor", primitive: { shape: "plane", size: [12, 12] }, color: [0.5, 0.5, 0.52], locked: true } },
      { command: "prefab.create", params: { kind: "person", id: "actor", name: "Actor", position: [0, 0, 0] } },
      { command: "prefab.create", params: { kind: "table", id: "table", position: [1.3, 0, -0.7] } },
      { command: "prefab.create", params: { kind: "chair", id: "chair", position: [1.3, 0, 0], rotationY: 180 } },
      { command: "prefab.create", params: { kind: "lamp", id: "lamp", position: [1.6, 0, -0.8] } },
      { command: "entity.place", params: { id: "lamp", nextTo: "table", side: "right", gap: 0.15 } },
      { command: "prefab.create", params: { kind: "crate", id: "box", scale: 0.4 } },
      { command: "entity.place", params: { id: "box", on: "table" } },
      { command: "prefab.create", params: { kind: "doorway", id: "door", position: [0, 0, -2.5] } },
      { command: "entity.create", params: { type: "camera", id: "cam_a", name: "Cam A" } },
      { command: "camera.frame", params: { camera: "cam_a", subject: "actor", size: "full", side: "frontRight" } },
      { command: "camera.dollyMove", params: { id: "cam_a", distance: 1.2, start: 0, end: 72 } },
      { command: "camera.orbitMove", params: { id: "cam_a", target: "actor", degrees: 40, start: 72, end: 119 } },
      { command: "shot.create", params: { camera: "cam_a", start: 0, end: 119, name: "push-in" } },
    ]);
    editor.on(ev => { if (ev.type === "change") console.debug("shotstage change", ev.revision); });
  </script>
</body>
</html>
