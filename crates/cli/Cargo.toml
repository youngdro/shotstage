[package]
name = "shotstage-cli"
description = "shotstage command line: run commands, JSON-lines server and MCP server over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shotstage"
path = "src/main.rs"

[dependencies]
shotstage-core.workspace = true
shotstage-commands.workspace = true
shotstage-render.workspace = true
serde_json.workspace = true
glam.workspace = true
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
