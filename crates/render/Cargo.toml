[package]
name = "shotstage-render"
description = "wgpu renderer for shotstage: clay, depth and normal passes, grid and camera overlays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shotstage-core.workspace = true
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
png = "0.18"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12", "gles", "parking_lot"] }
pollster = "1"
